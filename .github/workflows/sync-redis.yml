name: Sync TECMIS Notices to Redis

on:
  schedule:
    - cron: '10 */6 * * *'  # Run 10 minutes after scraper (every 6 hours)
  workflow_dispatch:        # manual trigger from the Actions tab
  workflow_run:
    workflows: ["Scrape TECMIS Notices"]
    types:
      - completed

permissions:
  contents: write  # Required to push attachments back to the repo

jobs:
  sync-to-redis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check API configuration
        id: check_config
        run: |
          if [ -z "${{ secrets.DB_MONITOR_API_URL }}" ] || [ -z "${{ secrets.DB_MONITOR_API_TOKEN }}" ]; then
            echo "API secrets not configured. Skipping Redis sync."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "API secrets configured. Proceeding with sync."
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Test API connectivity
        if: steps.check_config.outputs.configured == 'true'
        env:
          API_URL: ${{ secrets.DB_MONITOR_API_URL }}
          API_TOKEN: ${{ secrets.DB_MONITOR_API_TOKEN }}
        run: |
          echo "Testing API connectivity..."
          API_BASE_URL="${API_URL%/items}"
          
          # Test with verbose curl to see what's happening
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /dev/null \
            "${API_BASE_URL}/items" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            --max-time 30 \
            --connect-timeout 10)
          
          echo "HTTP Response Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "000" ]; then
            echo "ERROR: Could not connect to API"
            echo "API URL: ${API_BASE_URL}/items"
            echo "Please check:"
            echo "  1. DB_MONITOR_API_URL is correct"
            echo "  2. API is deployed and running"
            echo "  3. Network connectivity from GitHub Actions"
            exit 1
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "ERROR: Authentication failed (401 Unauthorized)"
            echo "Please check DB_MONITOR_API_TOKEN is correct"
            exit 1
          elif [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✓ API is reachable and authenticated"
          else
            echo "WARNING: Unexpected HTTP code: $HTTP_CODE"
            echo "Will proceed with sync anyway..."
          fi

      - name: Sync new notices to Redis
        if: steps.check_config.outputs.configured == 'true'
        env:
          API_URL: ${{ secrets.DB_MONITOR_API_URL }}
          API_TOKEN: ${{ secrets.DB_MONITOR_API_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import json
          import os
          import subprocess
          import urllib.request
          import urllib.parse
          from datetime import datetime
          from pathlib import Path
          
          api_url = os.environ['API_URL'].rstrip('/')
          api_token = os.environ['API_TOKEN']
          github_repo = os.environ['GITHUB_REPO']
          
          # Smart URL handling - works with both formats:
          # 1. https://api.vercel.app (base URL)
          # 2. https://api.vercel.app/api/items (full items URL)
          
          if '/items' in api_url:
              # Full URL provided (e.g., https://api.vercel.app/api/items)
              items_url = api_url
              base_api_url = api_url.rsplit('/items', 1)[0]
          elif '/api' in api_url:
              # API base provided (e.g., https://api.vercel.app/api)
              items_url = f"{api_url}/items"
              base_api_url = api_url
          else:
              # Domain only provided (e.g., https://api.vercel.app)
              items_url = f"{api_url}/api/items"
              base_api_url = f"{api_url}/api"
          
          print(f"Resolved API endpoints:")
          print(f"  Items URL: {items_url}")
          print(f"  Base URL:  {base_api_url}")
          
          # Step 1: Get all existing TECMIS notices from Redis
          print("Fetching existing TECMIS notices from Redis...")
          print(f"API URL: {items_url}")
          
          cmd = [
              'curl', '-sS', '-w', '\nHTTP_CODE:%{http_code}',
              items_url,
              '-H', f"Authorization: Bearer {api_token}"
          ]
          
          result = subprocess.run(cmd, capture_output=True, text=True)
          
          existing_ids = set()
          try:
              parts = result.stdout.rsplit('\nHTTP_CODE:', 1)
              if len(parts) == 2 and parts[1].strip() == '200':
                  body = parts[0].strip()
                  if body:  # Check if body is not empty
                      items = json.loads(body)
                      # Filter for TECMIS items
                      existing_ids = {item['id'] for item in items if item['id'].startswith('tecmis-')}
                      print(f"✓ Found {len(existing_ids)} existing TECMIS notice(s) in Redis")
                  else:
                      print("✓ Found 0 existing TECMIS notice(s) in Redis (empty response)")
              else:
                  print("✓ Found 0 existing TECMIS notice(s) in Redis (first sync)")
          except json.JSONDecodeError as e:
              print(f"⚠ Could not parse existing notices: {e}")
              print(f"  Response: {result.stdout[:200]}")
              print("  Will proceed with sync (treating as first sync)")
          except Exception as e:
              print(f"⚠ Error fetching existing notices: {e}")
              print("  Will proceed with sync")
          
          # Step 2: Read local notices.json (ALL notices)
          print("\nReading local notices.json...")
          try:
              with open('data/notices.json', 'r', encoding='utf-8') as f:
                  all_notices = json.load(f)
          except FileNotFoundError:
              print("✗ Error: data/notices.json not found!")
              exit(1)
          except json.JSONDecodeError as e:
              print(f"✗ Error: Could not parse data/notices.json: {e}")
              exit(1)
          
          print(f"\nTotal notices in local file: {len(all_notices)}")
          
          # Step 3: Filter for notices that don't exist in Redis yet
          new_notices = []
          
          for notice in all_notices:
              item_id = f"tecmis-{notice['id']}"
              
              # Only add if not already in Redis
              if item_id not in existing_ids:
                  new_notices.append(notice)
          
          if not new_notices:
              print("✓ No new notices to sync. All notices are already in Redis.")
              exit(0)
          
          print(f"\nFound {len(new_notices)} new notice(s) to sync...")
          
          # Step 4: Download PDFs for new notices
          attachments_dir = Path('data/attachments')
          attachments_dir.mkdir(parents=True, exist_ok=True)
          
          downloaded_files = []
          
          for notice in new_notices:
              url = notice.get('url', '')
              if not url or 'noticeid=' in url:  # Skip if no URL or if it's a notice page link
                  continue
              
              # Check if it's a PDF or document
              if any(ext in url.lower() for ext in ['.pdf', '.doc', '.docx', '.xls', '.xlsx']):
                  filename = notice.get('file')
                  if filename:
                      file_path = attachments_dir / filename
                      
                      # Only download if file doesn't exist
                      if not file_path.exists():
                          try:
                              print(f"  Downloading: {filename}...")
                              urllib.request.urlretrieve(url, file_path)
                              downloaded_files.append(filename)
                              print(f"  ✓ Saved: {filename}")
                          except Exception as e:
                              print(f"  ✗ Failed to download {filename}: {e}")
          
          if downloaded_files:
              print(f"\n✓ Downloaded {len(downloaded_files)} attachment(s)")
          
          # Step 5: Push new notices to Redis
          success_count = 0
          fail_count = 0
          skipped_count = 0
          
          for notice in new_notices:
              item_id = f"tecmis-{notice['id']}"
              
              # Double-check if item exists (in case it was added during this run)
              check_cmd = [
                  'curl', '-sS', '-w', '\nHTTP_CODE:%{http_code}',
                  f"{items_url}/{urllib.parse.quote(item_id, safe='')}",
                  '-H', f"Authorization: Bearer {api_token}"
              ]
              
              check_result = subprocess.run(check_cmd, capture_output=True, text=True)
              
              # If item exists (HTTP 200), skip it
              if 'HTTP_CODE:200' in check_result.stdout:
                  skipped_count += 1
                  continue
              
              # Clean up the title (remove "Download" suffix if present)
              title = notice['title'].replace('Download', '').strip()
              
              # Determine the URL to use
              document_url = notice.get('url', '')
              filename = notice.get('file')
              
              # If we have a file, use GitHub raw URL instead of TECMIS URL
              if filename and (attachments_dir / filename).exists():
                  document_url = f"https://raw.githubusercontent.com/{github_repo}/main/data/attachments/{filename}"
              
              # Format the body with notice details
              body = f"## {title}\n\n"
              body += f"**Posted:** {notice['posted_at']}\n\n"
              body += f"**Section:** {notice['section'].title()}\n\n"
              if document_url:
                  body += f"[View/Download]({document_url})"
              
              payload = {
                  "id": item_id,
                  "title": f"TECMIS: {title[:70]}{'...' if len(title) > 70 else ''}",
                  "body": body,
                  "type": "tecmis",
                  "createdAt": datetime.utcnow().isoformat() + 'Z',
                  "updatedAt": datetime.utcnow().isoformat() + 'Z',
                  "done": False,
                  "seen": False,
                  "source": "tecmis-scraper"
              }
              
              cmd = [
                  'curl', '-X', 'PUT',
                  f"{items_url}/{urllib.parse.quote(item_id, safe='')}",
                  '-H', f"Authorization: Bearer {api_token}",
                  '-H', 'Content-Type: application/json',
                  '-d', json.dumps(payload),
                  '-sS', '-w', '\nHTTP_CODE:%{http_code}',
                  '--max-time', '30',  # 30 second timeout
                  '--connect-timeout', '10'  # 10 second connection timeout
              ]
              
              result = subprocess.run(cmd, capture_output=True, text=True)
              
              # Check for connection errors
              if 'HTTP_CODE:000' in result.stdout or not result.stdout.strip():
                  print(f"✗ Connection failed: {title[:50]}...")
                  print(f"  Error: Could not connect to API")
                  if result.stderr:
                      print(f"  Curl error: {result.stderr[:200]}")
                  fail_count += 1
              elif 'HTTP_CODE:200' in result.stdout or 'HTTP_CODE:201' in result.stdout:
                  section_label = "📌" if notice['section'] == 'recent' else "📁"
                  print(f"✓ {section_label} Synced: {title[:50]}...")
                  success_count += 1
              else:
                  print(f"✗ Failed: {title[:50]}...")
                  print(f"  Response: {result.stdout[:200]}")
                  fail_count += 1
          
          print(f"\n{'='*60}")
          print(f"Sync complete!")
          print(f"  New:     {success_count}")
          print(f"  Skipped: {skipped_count}")
          print(f"  Failed:  {fail_count}")
          print(f"  Total in Redis: {len(existing_ids) + success_count}")
          print(f"{'='*60}")
          
          # Exit with error if all failed
          if fail_count > 0 and success_count == 0:
              exit(1)
          EOF

      - name: Commit and push attachments
        if: steps.check_config.outputs.configured == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/attachments/
          if git diff --staged --quiet; then
            echo "No new attachments to commit."
          else
            git commit -m "chore: add TECMIS notice attachments ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
            echo "✓ Pushed attachments to GitHub"
          fi
