name: Scrape TECMIS Notices

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch:        # manual trigger from the Actions tab

permissions:
  contents: write           # required to push commits back to the repo

concurrency:
  group: scrape-tecmis
  cancel-in-progress: false # never let two runs collide

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          TECMIS_USER: ${{ secrets.TECMIS_USER }}
          TECMIS_PASS: ${{ secrets.TECMIS_PASS }}
          # Set IGNORE_SSL_ERRORS=1 only if the university certificate
          # expires again; it is NOT needed normally.
          # IGNORE_SSL_ERRORS: ${{ vars.IGNORE_SSL_ERRORS }}
          # Download every attachment into data/attachments/:
          # DOWNLOAD_PDFS: '1'
        run: python scrape.py

      - name: Commit and push if changed
        id: commit_changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notices.json NOTICES.md
          if git diff --staged --quiet; then
            echo "No changes - nothing to commit."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update TECMIS notices ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Update Redis via API
        if: steps.commit_changes.outputs.changed == 'true'
        env:
          API_URL: ${{ secrets.DB_MONITOR_API_URL }}
          API_TOKEN: ${{ secrets.DB_MONITOR_API_TOKEN }}
        run: |
          # Read notices.json and create notification items for recent notices
          python - <<EOF
          import json
          import os
          import subprocess
          from datetime import datetime
          
          # Read the notices file
          with open('data/notices.json', 'r', encoding='utf-8') as f:
              notices = json.load(f)
          
          # Get only recent notices (first 5)
          recent_notices = [n for n in notices if n['section'] == 'recent'][:5]
          
          api_url = os.environ['API_URL']
          api_token = os.environ['API_TOKEN']
          
          print(f"Updating Redis with {len(recent_notices)} recent notices...")
          
          for notice in recent_notices:
              # Create a notification item for each notice
              item_id = f"tecmis-{notice['id']}"
              
              # Format the body with notice details
              body = f"## {notice['title']}\n\n"
              body += f"**Posted:** {notice['posted_at']}\n\n"
              if notice['url']:
                  body += f"[View/Download]({notice['url']})"
              
              payload = {
                  "id": item_id,
                  "title": f"TECMIS: {notice['title'][:50]}...",
                  "body": body,
                  "type": "info",
                  "createdAt": datetime.utcnow().isoformat() + 'Z',
                  "updatedAt": datetime.utcnow().isoformat() + 'Z',
                  "done": False,
                  "seen": False,
                  "source": "tecmis-scraper"
              }
              
              # Make PUT request to the API
              cmd = [
                  'curl', '-X', 'PUT',
                  f"{api_url}/{item_id}",
                  '-H', f"Authorization: Bearer {api_token}",
                  '-H', 'Content-Type: application/json',
                  '-d', json.dumps(payload),
                  '-s', '-w', '\\nHTTP_CODE:%{http_code}'
              ]
              
              result = subprocess.run(cmd, capture_output=True, text=True)
              
              if 'HTTP_CODE:200' in result.stdout or 'HTTP_CODE:201' in result.stdout:
                  print(f"✓ Updated {item_id}")
              else:
                  print(f"✗ Failed to update {item_id}: {result.stdout}")
          
          print("Redis update complete!")
          EOF
